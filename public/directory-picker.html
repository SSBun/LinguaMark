<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择 Markdown 目录 · LinguaMark</title>
    <link rel="stylesheet" href="directory-picker.css">
  </head>
  <body>
    <main class="picker-card" aria-labelledby="picker-title">
      <p class="eyebrow">LINGUAMARK DIRECTORY</p>
      <h1 id="picker-title">打开阅读目录</h1>
      <p class="description">LinguaMark 只读取你授权目录中的文件，不会修改或自动上传内容。</p>
      <p id="status" class="status" role="status" aria-live="polite">正在检查已有授权…</p>
      <div class="actions">
        <button id="restore-directory" class="secondary" type="button" hidden>使用已保存目录</button>
        <button id="choose-directory" class="primary" type="button">选择目录</button>
      </div>
    </main>
    <script src="directory-picker.js"></script>
  </body>
</html>
